<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>插件检测场景 · 本地联动测试</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <p class="eyebrow">本地联动测试</p>
    <h1>检测场景一览</h1>
    <p>每个场景触发一类媒体请求，用于验证 Chrome 插件的不同检测能力。点击「触发」后打开插件弹窗（或悬停视频点「视频链接」）核对结果。</p>
    <div id="scenarios" class="scenarios"></div>
    <p id="status" role="status">就绪。</p>
    <p class="note">此页面仅供本机测试；所有媒体由本机 ffmpeg 生成，无外部网络依赖。</p>
  </main>
  <script src="/scenarios.js" defer></script>
</body>
</html>
